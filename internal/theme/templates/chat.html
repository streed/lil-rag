{{define "chat-head"}}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
    .chat-container {
        background: var(--white);
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        padding: 40px;
        margin-bottom: 20px;
        height: 80vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .chat-main {
        display: flex;
        flex: 1;
        overflow: hidden;
        gap: 20px;
    }

    .sidebar {
        width: 280px;
        border-right: 1px solid var(--gray-200);
        display: flex;
        flex-direction: column;
        background: var(--gray-50);
        border-radius: 8px;
        padding: 15px;
    }

    .sidebar-header {
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--gray-200);
    }

    .sidebar-header h3 {
        font-size: 1rem;
        margin: 0;
        color: var(--gray-800);
    }

    .new-chat-btn {
        background: var(--primary-color);
        color: var(--white);
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        margin-top: 8px;
        transition: background-color 0.2s ease;
    }

    .new-chat-btn:hover {
        background: color-mix(in srgb, var(--primary-color) 85%, black);
    }

    .chat-sessions {
        flex: 1;
        overflow-y: auto;
        margin-top: 10px;
    }

    .chat-session {
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        margin-bottom: 5px;
        border: 1px solid transparent;
        transition: all 0.2s ease;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .chat-session-content {
        flex: 1;
    }

    .chat-session-actions {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
        opacity: 0.3;
        transition: opacity 0.2s ease;
    }

    .chat-session:hover .chat-session-actions {
        opacity: 1;
    }

    .delete-session-btn {
        background: var(--danger);
        color: var(--white);
        border: none;
        border-radius: 4px;
        width: 20px;
        height: 20px;
        cursor: pointer;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.8;
        transition: opacity 0.2s ease;
    }

    .delete-session-btn:hover {
        opacity: 1;
    }

    .chat-session.active .delete-session-btn {
        background: rgba(255, 255, 255, 0.2);
        color: var(--white);
    }

    .chat-session:hover {
        background: var(--gray-100);
        border-color: var(--gray-300);
    }

    .chat-session.active {
        background: var(--primary-color);
        color: var(--white);
    }

    .chat-session-title {
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .chat-session-time {
        font-size: 0.75rem;
        opacity: 0.7;
    }

    .chat-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .chat-header {
        background: transparent;
        color: var(--gray-800);
        padding: 20px 0;
        text-align: center;
        position: relative;
    }

    .chat-header h1 {
        font-size: 1.5rem;
        margin-bottom: 5px;
        color: var(--gray-900);
        border: none;
    }

    .chat-header p {
        opacity: 0.8;
        font-size: 0.9rem;
        color: var(--gray-600);
    }

    .clear-chat-button {
        position: absolute;
        top: 20px;
        right: 20px;
        background: color-mix(in srgb, var(--danger) 80%, transparent);
        color: var(--white);
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: background-color 0.2s ease;
    }

    .clear-chat-button:hover {
        background: var(--danger);
    }

    .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-width: 0;
    }

    .message {
        max-width: 80%;
        padding: 12px 18px;
        border-radius: 18px;
        word-wrap: break-word;
        overflow-wrap: break-word;
        hyphens: auto;
        line-height: 1.4;
    }

    .message.user {
        background: var(--primary-color);
        color: var(--white);
        align-self: flex-end;
        margin-left: auto;
    }

    .message.assistant {
        background: var(--gray-100);
        color: var(--gray-800);
        align-self: flex-start;
        border: 1px solid var(--gray-200);
    }

    .message.assistant h1,
    .message.assistant h2,
    .message.assistant h3,
    .message.assistant h4 {
        margin: 0.5em 0 0.3em 0;
        color: var(--gray-900);
    }

    .message.assistant h2 {
        font-size: 1.1em;
        font-weight: 600;
    }

    .message.assistant p {
        margin: 0.5em 0;
        line-height: 1.5;
    }

    .message.assistant strong {
        color: var(--gray-900);
        font-weight: 600;
    }

    .message.assistant code {
        background: var(--gray-200);
        padding: 2px 4px;
        border-radius: 3px;
        font-family: 'JetBrainsMono NL Nerd Font Propo', 'JetBrains Mono NL', 'JetBrains Mono', 
                     'Fira Code', 'Consolas', 'Monaco', monospace;
        font-size: 0.9em;
    }

    .message.assistant pre {
        background: var(--gray-50);
        border: 1px solid var(--gray-200);
        border-radius: 4px;
        padding: 12px;
        margin: 8px 0;
        overflow-x: auto;
        max-width: 100%;
        box-sizing: border-box;
        white-space: pre;
    }

    .message.assistant pre code {
        background: none;
        padding: 0;
    }

    .message.assistant ul,
    .message.assistant ol {
        margin: 0.5em 0;
        padding-left: 1.5em;
        max-width: 100%;
        box-sizing: border-box;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    .message.assistant li {
        margin: 0.3em 0;
        word-wrap: break-word;
        overflow-wrap: break-word;
        max-width: 100%;
        box-sizing: border-box;
    }

    .doc-ref-link {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9em;
        padding: 1px 3px;
        border-radius: 3px;
        transition: all 0.2s ease;
    }

    .doc-ref-link:hover {
        background-color: var(--primary-color);
        color: var(--white);
        text-decoration: none;
    }

    .sources-section {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--gray-300);
    }

    .sources-header {
        font-size: 0.85rem;
        color: var(--gray-600);
        margin-bottom: 8px;
        font-weight: 500;
    }

    .sources-compact {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
    }

    .source-button {
        background: var(--gray-100);
        border: 1px solid var(--gray-300);
        border-radius: 16px;
        padding: 4px 12px;
        font-size: 0.8rem;
        color: var(--gray-600);
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: 'JetBrainsMono NL Nerd Font Propo', 'JetBrains Mono NL', 
                     'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
    }

    .source-button:hover {
        background: var(--gray-200);
        border-color: var(--gray-400);
        color: var(--gray-800);
    }

    .source-expandable {
        margin: 8px 0;
        border: 1px solid var(--gray-300);
        border-radius: 8px;
        background: var(--gray-50);
    }

    .source-content {
        padding: 12px;
    }

    .source-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--gray-200);
        gap: 12px;
    }

    .source-id {
        font-weight: 600;
        color: var(--gray-700);
        font-size: 0.9rem;
    }

    .source-score {
        font-size: 0.8rem;
        color: var(--gray-500);
        font-style: italic;
    }

    .view-document-link {
        font-size: 0.75rem;
        color: var(--primary-color);
        text-decoration: none;
        padding: 2px 6px;
        border: 1px solid var(--primary-color);
        border-radius: 3px;
        transition: all 0.2s ease;
    }

    .view-document-link:hover {
        background-color: var(--primary-color);
        color: var(--white);
    }

    .source-text {
        color: var(--gray-600);
        font-size: 0.85rem;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: break-word;
        max-width: 100%;
        box-sizing: border-box;
    }

    .chat-input {
        padding: 20px;
        border-top: 1px solid var(--gray-200);
        background: var(--gray-50);
    }

    .token-counter {
        font-size: 0.8rem;
        color: var(--gray-600);
        text-align: right;
        margin-bottom: 8px;
        opacity: 0.8;
    }

    .token-counter.warning {
        color: #ff6b35;
    }

    .token-counter.danger {
        color: var(--danger);
        font-weight: 500;
    }

    .input-container {
        display: flex;
        gap: 10px;
        align-items: flex-end;
    }

    .message-input {
        flex: 1;
        padding: 12px 18px;
        border: 1px solid var(--gray-300);
        border-radius: 25px;
        font-size: 1rem;
        outline: none;
        resize: none;
        max-height: 120px;
        min-height: 44px;
    }

    .message-input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 10%, transparent);
    }

    .send-button {
        background: var(--primary-color);
        color: var(--white);
        border: none;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }

    .send-button:hover {
        background: color-mix(in srgb, var(--primary-color) 85%, black);
    }

    .send-button:disabled {
        background: var(--gray-400);
        cursor: not-allowed;
    }

    .typing-indicator {
        display: none;
        align-self: flex-start;
        background: var(--gray-100);
        padding: 12px 18px;
        border-radius: 18px;
        margin-bottom: 15px;
    }

    .typing-dots {
        display: flex;
        gap: 4px;
    }

    .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--gray-500);
        animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }

    .error-message {
        background: color-mix(in srgb, var(--danger) 10%, var(--white));
        color: color-mix(in srgb, var(--danger) 80%, black);
        border: 1px solid color-mix(in srgb, var(--danger) 20%, transparent);
        padding: 12px;
        border-radius: 8px;
        margin: 10px 0;
    }

    @media (max-width: 768px) {
        .chat-container {
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }
        
        .chat-panel {
            flex: 1;
        }
    }
</style>
{{end}}

{{define "chat-content"}}
<div class="chat-container">
    <div class="chat-header">
        <h1>🤖 LilRag Chat</h1>
        <p>Ask questions about your indexed documents</p>
        <button class="clear-chat-button" onclick="clearChatHistory()" title="Clear chat history">
            🗑️ Clear Chat
        </button>
    </div>
    
    <div class="chat-main">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Chat History</h3>
                <button class="new-chat-btn" onclick="startNewChat()">
                    ➕ New Chat
                </button>
            </div>
            <div class="chat-sessions" id="chatSessions">
                <!-- Chat sessions will be loaded here -->
            </div>
        </div>
        
        <div class="chat-panel">
            <div class="chat-messages" id="messages">
            </div>
            
            <div class="typing-indicator" id="typing">
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
            
            <div class="chat-input">
                <div class="token-counter" id="tokenCounter">
                    Tokens remaining: <span id="remainingTokens">1000</span>
                </div>
                <div class="input-container">
                    <textarea 
                        class="message-input" 
                        id="messageInput" 
                        placeholder="Ask a question about your documents..."
                        rows="1"
                    ></textarea>
                    <button class="send-button" id="sendButton" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "chat-scripts"}}
<script>
    // Chat application state
    let currentSession = null;
    let sessions = [];
    let titlePollingTimer = null;
    
    // DOM elements
    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const typingIndicator = document.getElementById('typing');
    const chatSessions = document.getElementById('chatSessions');
    const remainingTokens = document.getElementById('remainingTokens');
    const tokenCounter = document.getElementById('tokenCounter');

    // Auto-resize textarea and create session if needed
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        
        // Auto-create session when user starts typing if no session is active
        if (!currentSession && this.value.trim().length > 0) {
            createSessionForTyping();
        }
    });

    // Send message on Enter (but allow Shift+Enter for new lines)
    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Initialize the application
    document.addEventListener('DOMContentLoaded', function() {
        loadChatSessions();
    });

    // Load all chat sessions from the server
    async function loadChatSessions() {
        try {
            const response = await fetch('/api/chat/sessions');
            if (!response.ok) throw new Error('Failed to load chat sessions');
            
            const data = await response.json();
            sessions = data.sessions || [];
            renderChatSessions();
            
            // If no current session and there are sessions, load the most recent one
            if (!currentSession && sessions.length > 0) {
                loadChatSession(sessions[0].id);
            }
        } catch (error) {
            console.error('Error loading chat sessions:', error);
            sessions = [];
            renderChatSessions();
        }
    }

    // Render the chat sessions in the sidebar
    function renderChatSessions() {
        chatSessions.innerHTML = '';
        
        if (sessions.length === 0) {
            chatSessions.innerHTML = '<div style="text-align: center; color: var(--gray-600); font-style: italic; padding: 20px;">No chat history yet</div>';
            return;
        }

        sessions.forEach(session => {
            const sessionDiv = document.createElement('div');
            sessionDiv.className = 'chat-session' + (currentSession === session.id ? ' active' : '');
            sessionDiv.onclick = () => loadChatSession(session.id);
            
            const updatedAt = new Date(session.updated_at);
            const timeStr = updatedAt.toLocaleDateString() + ' ' + updatedAt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            sessionDiv.innerHTML = `
                <div class="chat-session-content">
                    <div class="chat-session-title">${escapeHtml(session.title)}</div>
                    <div class="chat-session-time">${timeStr}</div>
                </div>
                <div class="chat-session-actions">
                    <button class="delete-session-btn" onclick="deleteChatSession(event, '${session.id}')" title="Delete chat">
                        ×
                    </button>
                </div>
            `;
            
            chatSessions.appendChild(sessionDiv);
        });
    }

    // Load a specific chat session
    async function loadChatSession(sessionId) {
        // Clear any existing title polling
        if (titlePollingTimer) {
            clearTimeout(titlePollingTimer);
            titlePollingTimer = null;
        }
        
        try {
            const response = await fetch(`/api/chat/history/${sessionId}`);
            if (!response.ok) throw new Error('Failed to load chat history');
            
            const data = await response.json();
            currentSession = sessionId;
            
            // Clear messages and render history
            messagesContainer.innerHTML = '';
            
            // Handle both null and empty array cases
            const messages = data.messages || [];
            messages.forEach(message => {
                addMessage(message.content, message.role === 'user' ? 'user' : 'assistant', null, true);
            });
            
            // Update active session in sidebar
            renderChatSessions();
            
            // Scroll to bottom
            scrollToBottom();
            
        } catch (error) {
            console.error('Error loading chat session:', error);
            alert('Failed to load chat session');
        }
    }

    // Start a new chat session
    async function startNewChat() {
        // Clear any existing title polling
        if (titlePollingTimer) {
            clearTimeout(titlePollingTimer);
            titlePollingTimer = null;
        }
        
        try {
            const response = await fetch('/api/chat/sessions/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            
            if (!response.ok) throw new Error('Failed to create new chat session');
            
            const data = await response.json();
            currentSession = data.session.id;
            
            // Clear messages
            messagesContainer.innerHTML = '';
            
            // Reload sessions to include the new one
            await loadChatSessions();
            
            // Focus on input
            messageInput.focus();
            
        } catch (error) {
            console.error('Error creating new chat:', error);
            alert('Failed to create new chat session');
        }
    }

    // Create a session when user starts typing (silent, no UI changes except session creation)
    async function createSessionForTyping() {
        // Prevent multiple simultaneous creation attempts
        if (window.creatingSession) {
            return;
        }
        window.creatingSession = true;
        
        try {
            const response = await fetch('/api/chat/sessions/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            
            if (!response.ok) throw new Error('Failed to create new chat session');
            
            const data = await response.json();
            currentSession = data.session.id;
            
            // Silently reload sessions to include the new one (no UI disruption)
            await loadChatSessions();
            
        } catch (error) {
            console.error('Error creating session for typing:', error);
            // Don't show alert for silent session creation
        } finally {
            window.creatingSession = false;
        }
    }

    // Update the token counter display
    function updateTokenCounter(remaining, hasCompacted) {
        remainingTokens.textContent = remaining;
        
        // Update styling based on remaining tokens
        tokenCounter.className = 'token-counter';
        if (remaining < 200) {
            tokenCounter.className += ' danger';
        } else if (remaining < 400) {
            tokenCounter.className += ' warning';
        }
        
        // Show compaction notice if applicable
        if (hasCompacted) {
            const notice = document.createElement('div');
            notice.style.cssText = 'font-size: 0.75rem; color: var(--primary-color); margin-bottom: 5px; text-align: right;';
            notice.textContent = '📝 Chat history compacted to save context';
            tokenCounter.parentNode.insertBefore(notice, tokenCounter);
            
            // Remove notice after 5 seconds
            setTimeout(() => notice.remove(), 5000);
        }
    }

    function addMessage(content, type, sources = null, skipSave = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + type;
        
        // Render markdown for assistant messages, keep plain text for user messages
        let html = (type === 'assistant' && typeof marked !== 'undefined') ? marked.parse(content) : escapeHtml(content);
        
        // Style document references in square brackets for assistant messages
        if (type === 'assistant') {
            // Create clickable links to document viewer with chunk highlighting
            html = html.replace(/\[([a-zA-Z0-9_-]+)\]/g, function(match, docId) {
                // Find the source with this document ID to get chunk information
                let chunkParam = '';
                if (sources) {
                    const source = sources.find(s => s.ID === docId);
                    if (source && source.Metadata && source.Metadata.chunk_index !== undefined) {
                        chunkParam = '?highlight=' + source.Metadata.chunk_index;
                    }
                }
                return '<a href="/view/' + docId + chunkParam + 
                    '" class="doc-ref-link" target="_blank">[' + docId + ']</a>';
            });
        }
        
        if (sources && sources.length > 0) {
            html += '<div class="sources-section">';
            html += '<div class="sources-header">📚 Sources (' + sources.length + '):</div>';
            html += '<div class="sources-compact">';
            sources.forEach((source, index) => {
                const sourceId = 'source-' + Date.now() + '-' + index;
                html += '<button class="source-button" onclick="toggleSource(\'' + sourceId + '\')">';
                html += source.ID + ' (' + (source.Score * 100).toFixed(1) + '%)';
                html += '</button>';
            });
            html += '</div>';
            
            sources.forEach((source, index) => {
                const sourceId = 'source-' + Date.now() + '-' + index;
                html += '<div id="' + sourceId + '" class="source-expandable" style="display: none;">';
                html += '<div class="source-content">';
                html += '<div class="source-header">';
                html += '<span class="source-id">' + source.ID + '</span>';
                html += '<span class="source-score">' + (source.Score * 100).toFixed(1) + '% relevance</span>';
                const chunkParam = source.Metadata && source.Metadata.chunk_index !== undefined ? 
                    '?highlight=' + source.Metadata.chunk_index : '';
                html += '<a href="/view/' + source.ID + chunkParam + 
                    '" class="view-document-link" target="_blank">📄 View Document</a>';
                html += '</div>';
                html += '<div class="source-text">' + source.Text + '</div>';
                html += '</div>';
                html += '</div>';
            });
            html += '</div>';
        }
        
        messageDiv.innerHTML = html;
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || sendButton.disabled) return;

        // Disable input while processing
        messageInput.disabled = true;
        sendButton.disabled = true;

        // Add user message to UI
        addMessage(message, 'user');
        messageInput.value = '';
        messageInput.style.height = 'auto';

        // Show typing indicator
        showTyping();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    session_id: currentSession,
                    limit: 5
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            
            // Update session ID if this was a new chat
            if (data.session_id && data.session_id !== currentSession) {
                currentSession = data.session_id;
                await loadChatSessions(); // Reload to show new session
            }
            
            // Update token counter
            updateTokenCounter(data.remaining_tokens, data.has_compacted);

            // Add assistant response
            addMessage(data.response, 'assistant', data.sources);
            
            // Start polling for title updates after sending a message
            startTitlePolling();

        } catch (error) {
            console.error('Error sending message:', error);
            addMessage('Sorry, I encountered an error processing your request. Please try again.', 'assistant');
        } finally {
            hideTyping();
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
        }
    }
    
    // Poll for title updates to reflect async title generation
    function startTitlePolling() {
        // Clear any existing timer
        if (titlePollingTimer) {
            clearTimeout(titlePollingTimer);
        }
        
        // Start polling every 2 seconds for up to 30 seconds
        let pollAttempts = 0;
        const maxPollAttempts = 15; // 30 seconds / 2 seconds
        
        function pollForTitleUpdate() {
            if (pollAttempts >= maxPollAttempts) {
                return; // Stop polling after max attempts
            }
            
            pollAttempts++;
            loadChatSessions().then(() => {
                if (pollAttempts < maxPollAttempts) {
                    titlePollingTimer = setTimeout(pollForTitleUpdate, 2000);
                }
            }).catch(error => {
                console.error('Error polling for title updates:', error);
            });
        }
        
        // Start first poll after 3 seconds to give title generation time
        titlePollingTimer = setTimeout(pollForTitleUpdate, 3000);
    }

    function showTyping() {
        typingIndicator.style.display = 'block';
        messagesContainer.appendChild(typingIndicator);
        scrollToBottom();
    }

    function hideTyping() {
        typingIndicator.style.display = 'none';
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function toggleSource(sourceId) {
        const element = document.getElementById(sourceId);
        if (element) {
            const isVisible = element.style.display !== 'none';
            element.style.display = isVisible ? 'none' : 'block';
        }
    }

    function showError(message) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';
        errorDiv.textContent = message;
        messagesContainer.appendChild(errorDiv);
        scrollToBottom();
    }

    // Clear current chat (for the existing clear button)
    function clearChatHistory() {
        if (!confirm('Are you sure you want to clear this chat? This will start a new conversation.')) {
            return;
        }
        startNewChat();
    }

    // Utility function to escape HTML
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Delete a chat session
    async function deleteChatSession(event, sessionId) {
        event.stopPropagation(); // Prevent session from being loaded
        
        if (!confirm('Are you sure you want to delete this chat session? This cannot be undone.')) {
            return;
        }
        
        try {
            const response = await fetch(`/api/chat/sessions/${sessionId}`, {
                method: 'DELETE'
            });
            
            if (!response.ok) throw new Error('Failed to delete chat session');
            
            // If we deleted the current session, clear the chat
            if (currentSession === sessionId) {
                currentSession = null;
                messagesContainer.innerHTML = '';
            }
            
            // Reload sessions
            await loadChatSessions();
            
            // If current session was deleted, clear the current session
            if (!currentSession) {
                // Clear the chat messages since no session is selected
                messagesContainer.innerHTML = '';
            }
            
        } catch (error) {
            console.error('Error deleting chat session:', error);
            alert('Failed to delete chat session');
        }
    }

    // Focus input on load
    messageInput.focus();
</script>
