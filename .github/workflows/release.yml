---
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GO_VERSION: '1.23'

permissions:
  contents: write
  actions: read

jobs:
  validate-version:
    name: Validate Tag Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and validate version
        id: version
        run: |
          # Extract version from tag (remove 'v' prefix)
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_VERSION#v}
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          
          # Read version from VERSION file
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "file_version=$FILE_VERSION" >> $GITHUB_OUTPUT
          
          echo "Tag version: $TAG_VERSION"
          echo "File version: $FILE_VERSION"
          
          # Validate that tag version matches VERSION file
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
            echo "Please update the VERSION file to match the tag or create a tag that matches the VERSION file"
            exit 1
          fi
          
          echo "version=$FILE_VERSION" >> $GITHUB_OUTPUT
          echo "Version validation successful: $FILE_VERSION"

  build-release:
    name: Build Release Binaries
    needs: validate-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
            archive: tar.gz
            cgo_enabled: 1
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
            archive: tar.gz
            cgo_enabled: 1
            cc: aarch64-linux-gnu-gcc
            setup_cross: |
              sudo apt-get update && \
                sudo apt-get install -y gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64
            extension: .exe
            archive: zip
            cgo_enabled: 1
            cc: x86_64-w64-mingw32-gcc
            setup_cross: |
              sudo apt-get update && \
                sudo apt-get install -y gcc-mingw-w64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            archive: tar.gz
            cgo_enabled: 1
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            archive: tar.gz
            cgo_enabled: 1
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up cross-compilation tools
        if: matrix.setup_cross
        run: ${{ matrix.setup_cross }}

      - name: Install dependencies
        run: go mod download

      - name: Fix SQLite headers for cross-compilation
        if: matrix.goos == 'windows'
        run: |
          # Create symlink for sqlite3.h to fix sqlite-vec compilation
          GOMODCACHE=$(go env GOMODCACHE)
          SQLITE_VEC_DIR="$GOMODCACHE/github.com/asg017/sqlite-vec-go-bindings@v0.1.6/cgo"
          SQLITE3_HEADER="$GOMODCACHE/github.com/mattn/go-sqlite3@v1.14.32/sqlite3-binding.h"
          
          if [ -d "$SQLITE_VEC_DIR" ] && [ -f "$SQLITE3_HEADER" ]; then
            sudo ln -sf "$SQLITE3_HEADER" "$SQLITE_VEC_DIR/sqlite3.h"
            echo "Created symlink: $SQLITE_VEC_DIR/sqlite3.h -> $SQLITE3_HEADER"
          else
            echo "Warning: Could not create sqlite3.h symlink"
            ls -la "$SQLITE_VEC_DIR" || echo "sqlite-vec dir not found"
            ls -la "$SQLITE3_HEADER" || echo "sqlite3-binding.h not found"
          fi

      - name: Run tests (Linux only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -v ./...

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          CC: ${{ matrix.cc }}
        shell: bash
        run: |
          EXT="${{ matrix.extension }}"
          SUFFIX="${{ matrix.suffix }}"
          VERSION="${{ needs.validate-version.outputs.version }}"

          echo "Building for $GOOS/$GOARCH with version $VERSION (CGO_ENABLED=$CGO_ENABLED)"

          go build -ldflags="-s -w -X main.version=$VERSION" \
            -o "dist/lil-rag-$SUFFIX$EXT" ./cmd/lil-rag
          go build -ldflags="-s -w -X main.version=$VERSION" \
            -o "dist/lil-rag-server-$SUFFIX$EXT" ./cmd/lil-rag-server
          go build -ldflags="-s -w -X main.version=$VERSION" \
            -o "dist/lil-rag-mcp-$SUFFIX$EXT" ./cmd/lil-rag-mcp

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          EXT="${{ matrix.extension }}"

          cd dist
          tar -czf "lil-rag-$VERSION-$SUFFIX.tar.gz" \
            "lil-rag-$SUFFIX$EXT" \
            "lil-rag-server-$SUFFIX$EXT" \
            "lil-rag-mcp-$SUFFIX$EXT"

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          EXT="${{ matrix.extension }}"

          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Use PowerShell on Windows for zip creation
            powershell -Command "Compress-Archive \
              -Path 'lil-rag-$SUFFIX$EXT', \
              'lil-rag-server-$SUFFIX$EXT', \
              'lil-rag-mcp-$SUFFIX$EXT' \
              -DestinationPath 'lil-rag-$VERSION-$SUFFIX.zip'"
          else
            zip "lil-rag-$VERSION-$SUFFIX.zip" \
              "lil-rag-$SUFFIX$EXT" \
              "lil-rag-server-$SUFFIX$EXT" \
              "lil-rag-mcp-$SUFFIX$EXT"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lil-rag-${{ needs.validate-version.outputs.version }}-${{ matrix.suffix }}
          path: |
            dist/lil-rag-${{ needs.validate-version.outputs.version }}-${{ matrix.suffix }}.*
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [validate-version, build-release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lil-rag-${{ needs.validate-version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          find . -name "*.tar.gz" -o -name "*.zip" | \
            xargs sha256sum > checksums.txt
          ls -la

      - name: Read CHANGELOG for release notes
        id: changelog
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          
          # Try to extract release notes from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Look for version section in changelog
            NOTES=$(awk "/^## \[?v?$VERSION\]?/,/^## \[?v?[0-9]/" CHANGELOG.md | head -n -1 | tail -n +2)
            if [ -n "$NOTES" ]; then
              echo "Found changelog entry for version $VERSION"
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              echo "$NOTES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "No changelog entry found for version $VERSION"
              echo "notes=" >> $GITHUB_OUTPUT
            fi
          else
            echo "No CHANGELOG.md found"
            echo "notes=" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-version.outputs.version }}
          name: Release v${{ needs.validate-version.outputs.version }}
          body: |
            ## 🚀 Release v${{ needs.validate-version.outputs.version }}

            Official release built from VERSION file content.

            ### 📦 Downloads
            - **Linux AMD64**: `lil-rag-${{ needs.validate-version.outputs.version }}-linux-amd64.tar.gz`
            - **Linux ARM64**: `lil-rag-${{ needs.validate-version.outputs.version }}-linux-arm64.tar.gz`
            - **Windows AMD64**: `lil-rag-${{ needs.validate-version.outputs.version }}-windows-amd64.zip`
            - **macOS AMD64**: `lil-rag-${{ needs.validate-version.outputs.version }}-darwin-amd64.tar.gz`
            - **macOS ARM64**: `lil-rag-${{ needs.validate-version.outputs.version }}-darwin-arm64.tar.gz`

            ### 📋 Quick Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ### 🔍 Verification
            All binaries are built with version `${{ needs.validate-version.outputs.version }}` from the VERSION file.
            Use `--version` flag to verify:
            ```bash
            ./lil-rag --version
            ./lil-rag-server --version
            ```

            ${{ steps.changelog.outputs.notes && '### 📝 Release Notes' || '' }}
            ${{ steps.changelog.outputs.notes }}

            **Version Source**: VERSION file (v${{ needs.validate-version.outputs.version }})
            **Build Method**: Native platform compilation with CGO support
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** v${{ needs.validate-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version Source:** VERSION file" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** Linux (AMD64, ARM64), Windows (AMD64), macOS (AMD64, ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "**Build Method:** Native platform compilation" >> $GITHUB_STEP_SUMMARY
          
          ARTIFACT_COUNT=$(ls -1 dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          echo "**Artifacts:** $ARTIFACT_COUNT archives created" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Release URL" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/tag/v${{ needs.validate-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Generated:" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY