---
name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_strategy:
        description: 'Version strategy for manual builds'
        required: false
        default: 'auto-increment'
        type: choice
        options:
          - auto-increment
          - use-version-file
      custom_version:
        description: 'Custom version (only used with use-version-file strategy)'
        required: false
        type: string

env:
  GO_VERSION: '1.23'

permissions:
  contents: write  # Needed to push VERSION file changes and create releases
  actions: read

jobs:
  version:
    name: Version Management
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version strategy
        id: version
        run: |
          # Check if this is a tag build
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IS_TAG=true
            # Extract version from tag (remove 'v' prefix)
            TAG_VERSION=${GITHUB_REF#refs/tags/}
            TAG_VERSION=${TAG_VERSION#v}
            
            # Read version from VERSION file
            FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
            
            echo "Tag build detected"
            echo "Tag version: $TAG_VERSION"
            echo "File version: $FILE_VERSION"
            
            # Validate that tag version matches VERSION file
            if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
              echo "Error: Tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
              echo "Please update the VERSION file to match the tag or create a tag that matches the VERSION file"
              exit 1
            fi
            
            VERSION=$FILE_VERSION
            echo "Version validation successful: $VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual trigger - check user's strategy choice
            STRATEGY="${{ github.event.inputs.version_strategy }}"
            echo "Manual workflow dispatch detected"
            echo "Version strategy: $STRATEGY"
            
            if [[ "$STRATEGY" == "use-version-file" ]]; then
              IS_TAG=true
              # Use version from file (treat as tag build for release purposes)
              CURRENT_VERSION=$(cat VERSION | tr -d '[:space:]')
              
              # Check if user provided custom version
              CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"
              if [[ -n "$CUSTOM_VERSION" ]]; then
                echo "Using custom version: $CUSTOM_VERSION"
                echo "$CUSTOM_VERSION" > VERSION
                VERSION="$CUSTOM_VERSION"
              else
                echo "Using version from file: $CURRENT_VERSION"
                VERSION="$CURRENT_VERSION"
              fi
            else
              IS_TAG=false
              # Auto-increment patch version (treat as main branch build)
              CURRENT_VERSION=$(cat VERSION | tr -d '[:space:]')
              echo "Current version: $CURRENT_VERSION"

              # Increment patch version
              IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
              MAJOR=${VERSION_PARTS[0]}
              MINOR=${VERSION_PARTS[1]}
              PATCH=${VERSION_PARTS[2]}

              NEW_PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

              echo "$VERSION" > VERSION
              echo "Version incremented to: $VERSION"
            fi
          else
            IS_TAG=false
            # Main branch build - increment patch version
            CURRENT_VERSION=$(cat VERSION | tr -d '[:space:]')
            echo "Main branch build detected"
            echo "Current version: $CURRENT_VERSION"

            # Increment patch version
            IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
            MAJOR=${VERSION_PARTS[0]}
            MINOR=${VERSION_PARTS[1]}
            PATCH=${VERSION_PARTS[2]}

            NEW_PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

            echo "$VERSION" > VERSION
            echo "Version incremented to: $VERSION"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT

      - name: Commit version update (auto-increment builds only)
        if: steps.version.outputs.is_tag == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add VERSION
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            TRIGGER_TYPE="${{ github.event_name == 'workflow_dispatch' && '[manual]' || '[skip ci]' }}"
            git commit -m "Bump version to ${{ steps.version.outputs.version }} $TRIGGER_TYPE"
            # Only push if this is not a manual workflow dispatch or if it's auto-increment
            if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] || [[ "${{ github.event.inputs.version_strategy }}" == "auto-increment" ]]; then
              git push
            else
              echo "Manual workflow dispatch with custom version - skipping push"
            fi
          fi

  build-cross-platform:
    name: Build Native Binaries
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
            archive: tar.gz
            cgo_enabled: 1
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
            archive: tar.gz
            cgo_enabled: 1
            cc: aarch64-linux-gnu-gcc
            setup_cross: |
              sudo apt-get update && \
                sudo apt-get install -y gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64
            extension: .exe
            archive: zip
            cgo_enabled: 1
            cc: x86_64-w64-mingw32-gcc
            setup_cross: |
              sudo apt-get update && \
                sudo apt-get install -y gcc-mingw-w64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            archive: tar.gz
            cgo_enabled: 1
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            archive: tar.gz
            cgo_enabled: 1
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up cross-compilation tools
        if: matrix.setup_cross
        run: ${{ matrix.setup_cross }}

      - name: Install dependencies
        run: go mod download

      - name: Fix SQLite headers for cross-compilation
        if: matrix.goos == 'windows'
        run: |
          # Create symlink for sqlite3.h to fix sqlite-vec compilation
          GOMODCACHE=$(go env GOMODCACHE)
          SQLITE_VEC_DIR="$GOMODCACHE/github.com/asg017/sqlite-vec-go-bindings@v0.1.6/cgo"
          SQLITE3_HEADER="$GOMODCACHE/github.com/mattn/go-sqlite3@v1.14.32/sqlite3-binding.h"
          
          if [ -d "$SQLITE_VEC_DIR" ] && [ -f "$SQLITE3_HEADER" ]; then
            sudo ln -sf "$SQLITE3_HEADER" "$SQLITE_VEC_DIR/sqlite3.h"
            echo "Created symlink: $SQLITE_VEC_DIR/sqlite3.h -> $SQLITE3_HEADER"
          else
            echo "Warning: Could not create sqlite3.h symlink"
            ls -la "$SQLITE_VEC_DIR" || echo "sqlite-vec dir not found"
            ls -la "$SQLITE3_HEADER" || echo "sqlite3-binding.h not found"
          fi

      - name: Run tests (Linux only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -v ./...

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          CC: ${{ matrix.cc }}
        shell: bash
        run: |
          EXT="${{ matrix.extension }}"
          SUFFIX="${{ matrix.suffix }}"
          VERSION="${{ needs.version.outputs.version }}"

          echo "Building for $GOOS/$GOARCH with version $VERSION (CGO_ENABLED=$CGO_ENABLED)"

          go build -ldflags="-s -w -X main.version=$VERSION" \
            -o "dist/lil-rag-$SUFFIX$EXT" ./cmd/lil-rag
          go build -ldflags="-s -w -X main.version=$VERSION" \
            -o "dist/lil-rag-server-$SUFFIX$EXT" ./cmd/lil-rag-server
          go build -ldflags="-s -w -X main.version=$VERSION" \
            -o "dist/lil-rag-mcp-$SUFFIX$EXT" ./cmd/lil-rag-mcp

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          EXT="${{ matrix.extension }}"

          cd dist
          tar -czf "lil-rag-$VERSION-$SUFFIX.tar.gz" \
            "lil-rag-$SUFFIX$EXT" \
            "lil-rag-server-$SUFFIX$EXT" \
            "lil-rag-mcp-$SUFFIX$EXT"

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          EXT="${{ matrix.extension }}"

          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Use PowerShell on Windows for zip creation
            powershell -Command "Compress-Archive \
              -Path 'lil-rag-$SUFFIX$EXT', \
              'lil-rag-server-$SUFFIX$EXT', \
              'lil-rag-mcp-$SUFFIX$EXT' \
              -DestinationPath 'lil-rag-$VERSION-$SUFFIX.zip'"
          else
            zip "lil-rag-$VERSION-$SUFFIX.zip" \
              "lil-rag-$SUFFIX$EXT" \
              "lil-rag-server-$SUFFIX$EXT" \
              "lil-rag-mcp-$SUFFIX$EXT"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lil-rag-${{ needs.version.outputs.version }}-${{ matrix.suffix }}
          path: |
            dist/lil-rag-${{ needs.version.outputs.version }}-${{ matrix.suffix }}.*
          retention-days: ${{ needs.version.outputs.is_tag == 'true' && 90 || 30 }}

  create-release:
    name: Create GitHub Release
    needs: [version, build-cross-platform]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lil-rag-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          find . -name "*.tar.gz" -o -name "*.zip" | \
            xargs sha256sum > checksums.txt
          ls -la

      - name: Read CHANGELOG for release notes (tag builds only)
        if: needs.version.outputs.is_tag == 'true'
        id: changelog
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          
          # Try to extract release notes from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Look for version section in changelog
            NOTES=$(awk "/^## \[?v?$VERSION\]?/,/^## \[?v?[0-9]/" CHANGELOG.md | head -n -1 | tail -n +2)
            if [ -n "$NOTES" ]; then
              echo "Found changelog entry for version $VERSION"
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              echo "$NOTES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "No changelog entry found for version $VERSION"
              echo "notes=" >> $GITHUB_OUTPUT
            fi
          else
            echo "No CHANGELOG.md found"
            echo "notes=" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release v${{ needs.version.outputs.version }}
          body: |
            ## 🚀 Release v${{ needs.version.outputs.version }}

            ${{ needs.version.outputs.is_tag == 'true' && (github.event_name == 'workflow_dispatch' && 'Manual release built using VERSION file content.' || 'Official release built from VERSION file content.') || (github.event_name == 'workflow_dispatch' && 'Manual build from workflow dispatch.' || 'Auto-generated release from main branch build using native platform compilation.') }}

            ### 📦 Downloads
            - **Linux AMD64**: `lil-rag-${{ needs.version.outputs.version }}-linux-amd64.tar.gz`
            - **Linux ARM64**: `lil-rag-${{ needs.version.outputs.version }}-linux-arm64.tar.gz`
            - **Windows AMD64**: `lil-rag-${{ needs.version.outputs.version }}-windows-amd64.zip`
            - **macOS AMD64**: `lil-rag-${{ needs.version.outputs.version }}-darwin-amd64.tar.gz`
            - **macOS ARM64**: `lil-rag-${{ needs.version.outputs.version }}-darwin-arm64.tar.gz`

            ### 📋 Quick Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ### 🔍 Verification
            All binaries are built with version `${{ needs.version.outputs.version }}` and can be verified with:
            ```bash
            ./lil-rag --version
            ./lil-rag-server --version
            ```

            ${{ needs.version.outputs.is_tag == 'true' && steps.changelog.outputs.notes && '### 📝 Release Notes' || '' }}
            ${{ needs.version.outputs.is_tag == 'true' && steps.changelog.outputs.notes || '' }}

            ${{ needs.version.outputs.is_tag == 'false' && '### ✨ What''s New' || '' }}
            ${{ needs.version.outputs.is_tag == 'false' && 'This release includes all changes merged to main since the previous release.' || '' }}

            **Version Source**: ${{ needs.version.outputs.is_tag == 'true' && (github.event_name == 'workflow_dispatch' && 'Manual build using VERSION file' || 'VERSION file (official release)') || (github.event_name == 'workflow_dispatch' && 'Manual workflow dispatch' || 'Auto-incremented from main branch') }}
            **Build Method**: Native platform compilation with CGO support
            ${{ github.event_name == 'workflow_dispatch' && format('**Trigger**: Manual workflow dispatch (strategy: {0})', github.event.inputs.version_strategy) || '' }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          draft: false
          prerelease: ${{ needs.version.outputs.is_tag == 'false' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          BUILD_TYPE="${{ needs.version.outputs.is_tag == 'true' && 'Official Release' || 'Development Build' }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="Manual $BUILD_TYPE"
          fi
          echo "**Build Type:** $BUILD_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name == 'workflow_dispatch' && 'Manual workflow dispatch' || github.event_name }}" >> $GITHUB_STEP_SUMMARY
          ${{ github.event_name == 'workflow_dispatch' && 'echo "**Strategy:** ${{ github.event.inputs.version_strategy }}" >> $GITHUB_STEP_SUMMARY' || '' }}
          echo "**Version:** ${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** v${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          VERSION_SOURCE="${{ needs.version.outputs.is_tag == 'true' && 'VERSION file' || 'Auto-incremented' }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_SOURCE="$VERSION_SOURCE (manual)"
          fi
          echo "**Version Source:** $VERSION_SOURCE" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** Linux (AMD64, ARM64), Windows (AMD64), macOS (AMD64, ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "**Build Method:** Native platform compilation" >> $GITHUB_STEP_SUMMARY
          echo "**Prerelease:** ${{ needs.version.outputs.is_tag == 'false' && 'Yes' || 'No' }}" >> $GITHUB_STEP_SUMMARY
          
          ARTIFACT_COUNT=$(ls -1 dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          echo "**Artifacts:** $ARTIFACT_COUNT archives created" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Release URL" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Generated:" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY