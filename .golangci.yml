# Configuration for golangci-lint v2.4
# https://github.com/golangci/golangci-lint

version: 2

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: false
  skip-dirs:
    - test_pdfs

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - unnamedResult
      - hugeParam
      - rangeValCopy

  gocyclo:
    min-complexity: 15

  govet:
    enable:
      - shadow
    disable:
      - fieldalignment

  errcheck:
    check-type-assertions: true
    check-blank: true

  exhaustive:
    default-signifies-exhaustive: true

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  lll:
    line-length: 120

  unparam:
    check-exported: false

  nakedret:
    max-func-lines: 30

linters:
  disable-all: true
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - exhaustive
    - goconst
    - gocritic
    - revive
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

issues:
  exclude:
    # Exclude some gosec messages
    - "G404: Use of weak random number generator"
    
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  text:
    colors: true
    print-linter-name: true
    print-issued-lines: true