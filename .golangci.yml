# Configuration for golangci-lint
# https://github.com/golangci/golangci-lint

run:
  timeout: 5m
  modules-download-mode: readonly

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - unnamedResult
      - hugeParam
      - rangeValCopy

  gocyclo:
    min-complexity: 15

  govet:
    enable:
      - shadow
    disable:
      - fieldalignment

  errcheck:
    check-type-assertions: true
    check-blank: true

  exhaustive:
    default-signifies-exhaustive: true

  gofmt:
    simplify: true

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  lll:
    line-length: 120

  unparam:
    check-exported: false

  nakedret:
    max-func-lines: 30

linters:
  disable-all: true
  enable:
    - bodyclose
    - copyloopvar  # replaces deprecated exportloopref
    - dogsled
    - errcheck
    - exhaustive
    - goconst
    - gocritic
    - revive  # replaces golint
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    # typecheck disabled due to Go version compatibility issue with unicode package

issues:
  exclude-rules:
    # Disable all lint checks for test files
    - path: _test\.go
      linters:
        - bodyclose
        - exportloopref
        - dogsled
        - errcheck
        - exhaustive
        - goconst
        - gocritic
        - revive
        - gosec
        - govet
        - ineffassign
        - lll
        - misspell
        - nakedret
        - rowserrcheck
        - staticcheck
        - unconvert
        - unparam
        - unused
        - whitespace
    
    # Disable typecheck for all files to work around Go version issues
    - path: ".*"
      linters:
        - typecheck
    
    - linters:
        - lll
      source: "^//go:generate "

  exclude:
    # Exclude some gosec messages
    - "G404: Use of weak random number generator"
    # Exclude unicode import issue (Go version compatibility)
    - "could not import unicode.*unsupported version.*typecheck"
    # Exclude typecheck issues in test files (false positives)
    - "declared and not used.*typecheck.*_test\\.go"
    
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true